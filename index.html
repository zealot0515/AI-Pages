<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI NewsPage</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #050505;
      --muted: #707070;
      --line: #dedede;
      --accent: #057dbc;
      --accent-strong: #000000;
      --soft: #f5f5f5;
      --ink: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Aptos", "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 56px;
    }

    header {
      padding: 14px 0 20px;
      border-top: 8px solid var(--ink);
      border-bottom: 2px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 64px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0;
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .dek {
      max-width: 680px;
      margin: 14px 0 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 19px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-top: 20px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    button {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      min-height: 40px;
      padding: 8px 14px;
      text-transform: uppercase;
    }

    button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(280px, 0.9fr);
      gap: 32px;
      margin-top: 26px;
    }

    article {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
    }

    .lead-story {
      padding: 0 0 26px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--ink);
    }

    .story-image {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 0;
      margin-bottom: 16px;
      background: var(--line);
    }

    .story-list {
      display: grid;
      gap: 0;
    }

    .story {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 18px;
      padding: 18px 0;
    }

    h2 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 25px;
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: 0;
    }

    a {
      color: var(--accent);
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    p {
      margin: 8px 0;
    }

    .story-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .highlights {
      margin: 14px 0 0;
      padding-left: 20px;
    }

    .highlights li {
      margin: 6px 0;
    }

    .why {
      border-left: 3px solid var(--accent-strong);
      margin-top: 14px;
      padding-left: 12px;
      color: var(--text);
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
    }

    .public-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .tag {
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 3px 7px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    aside {
      border-left: 1px solid var(--line);
      padding-left: 24px;
    }

    aside h2 {
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 22px;
      font-weight: 400;
    }

    .source-list {
      display: grid;
      gap: 12px;
    }

    .source {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .empty-state {
      background: var(--soft);
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--line);
      padding: 24px 0;
    }

    .source strong {
      display: block;
      margin-bottom: 3px;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 24px, 1040px);
        padding: 24px 0;
      }

      header,
      .layout {
        display: block;
      }

      h1 {
        font-size: 42px;
      }

      .meta {
        text-align: left;
        margin-top: 12px;
      }

      aside {
        border-left: 0;
        padding-left: 0;
        margin-top: 24px;
      }

      .story {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="kicker">Daily reviewed AI brief</p>
        <h1>AI NewsPage</h1>
        <p class="dek">A source-backed morning briefing for AI models, agent skills, open-source projects, and developer workflows.</p>
      </div>
      <div class="meta">
        <div>59 public stories</div>
        <div>5 public sources</div>
        <div>Generated 2026-05-16T21:22:51Z</div>
      </div>
    </header>
    <nav id="filters" class="toolbar" aria-label="News filters"></nav>
    <div class="layout">
      <section id="news" aria-live="polite"></section>
      <aside>
        <h2>Public Sources</h2>
        <div id="sources" class="source-list"></div>
      </aside>
    </div>
  </main>
  <script>
    const newsEl = document.querySelector("#news");
    const filtersEl = document.querySelector("#filters");
    const sourcesEl = document.querySelector("#sources");
    let allNews = [];
    let activeCategory = "All";

    Promise.all([
      fetch("./data/news.json").then((response) => {
        if (!response.ok) throw new Error("Failed to load public news");
        return response.json();
      }),
      fetch("./data/sites.json").then((response) => {
        if (!response.ok) throw new Error("Failed to load public sources");
        return response.json();
      })
    ])
      .then(([news, sources]) => {
        allNews = news;
        renderFilters(news);
        renderNews(news);
        renderSources(sources);
      })
      .catch((error) => {
        newsEl.textContent = error.message;
      });

    function renderFilters(news) {
      const categories = ["All", ...new Set(news.map((item) => item.category).filter(Boolean))];
      filtersEl.innerHTML = categories.map((category) => (
        `<button type="button" aria-pressed="${category === activeCategory}" data-category="${escapeAttribute(category)}">${escapeHtml(categoryLabel(category))}</button>`
      )).join("");

      filtersEl.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          renderFilters(allNews);
          renderNews(allNews);
        });
      });
    }

    function renderNews(news) {
      const visible = activeCategory === "All"
        ? news
        : news.filter((item) => item.category === activeCategory);

      if (visible.length === 0) {
        newsEl.textContent = "No public stories in this category.";
        return;
      }

      const [lead, ...rest] = visible;
      newsEl.innerHTML = `
        <article class="lead-story">
          <div class="story-meta">${escapeHtml(formatDate(lead.published_at))} / ${escapeHtml(categoryLabel(lead.category))}</div>
          ${renderImage(lead)}
          <h2>${escapeHtml(lead.title)}</h2>
          <p>${escapeHtml(lead.summary)}</p>
          ${renderHighlights(lead.highlights)}
          ${renderWhy(lead.why_it_matters)}
          ${renderPublicNote(lead.public_notes)}
          ${renderTags(lead.tags)}
          <p><a href="${escapeAttribute(lead.original_url || lead.source_url)}" rel="noopener noreferrer" target="_blank">Read original: ${escapeHtml(lead.source)}</a></p>
        </article>
        <div class="story-list">
          ${rest.map((item) => `
            <article class="story">
              <div>
                <div class="story-meta">${escapeHtml(formatDate(item.published_at))} / ${escapeHtml(categoryLabel(item.category))}</div>
                <h3>${escapeHtml(item.title)}</h3>
                <p>${escapeHtml(item.summary)}</p>
                ${renderHighlights(item.highlights)}
                ${renderWhy(item.why_it_matters)}
                ${renderPublicNote(item.public_notes)}
                ${renderTags(item.tags)}
                <p><a href="${escapeAttribute(item.original_url || item.source_url)}" rel="noopener noreferrer" target="_blank">Read original: ${escapeHtml(item.source)}</a></p>
              </div>
              <div class="story-media">${renderImage(item)}</div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderSources(sources) {
      sourcesEl.innerHTML = sources.map((source) => `
        <div class="source">
          <strong>${escapeHtml(source.name || source.id)}</strong>
          <a href="${escapeAttribute(source.url)}" rel="noopener noreferrer" target="_blank">${escapeHtml(source.url)}</a>
          <p>${escapeHtml(source.public_notes || "")}</p>
        </div>
      `).join("");
    }

    function renderHighlights(highlights) {
      const items = (highlights || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      return items ? `<ul class="highlights">${items}</ul>` : "";
    }

    function renderWhy(value) {
      return value ? `<p class="why">${escapeHtml(value)}</p>` : "";
    }

    function renderPublicNote(value) {
      return value ? `<p class="public-note">${escapeHtml(value)}</p>` : "";
    }

    function renderImage(item) {
      if (!item.image_url) return "";
      return `<img class="story-image" src="${escapeAttribute(item.image_url)}" alt="" loading="lazy">`;
    }

    function renderTags(tags) {
      const items = (tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      return `<div class="tags">${items}</div>`;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "";
      return new Intl.DateTimeFormat("zh-TW", {
        year: "numeric",
        month: "short",
        day: "numeric"
      }).format(date);
    }

    function categoryLabel(value) {
      return ({
        "All": "All",
        "hot-topics": "Hot AI Topics",
        "agent-skills": "Agent Skills",
        "open-source-ai": "Open Source AI",
        "ai-deals": "AI Deals",
        "new-models": "New Models",
        "AI agents": "Agent Skills",
        "Models": "New Models",
        "Media": "AI Media"
      })[value] || value || "AI";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>

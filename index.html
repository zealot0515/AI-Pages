<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Morning Radar</title>
  <style>
    :root{--paper:#f3eedf;--panel:#fff9e8;--ink:#171713;--muted:#6f6a5d;--signal:#b5ff41;--cyan:#16a6a3;--line:rgba(23,23,19,.16);font-family:"Noto Sans TC","Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);line-height:1.55}main{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.hero{border:1px solid var(--ink);border-radius:26px;padding:28px;background:var(--panel);box-shadow:8px 8px 0 rgba(23,23,19,.1)}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(3rem,9vw,7rem);line-height:.9;letter-spacing:-.06em;margin:0}.dek{color:var(--muted);max-width:760px}.metrics,.filters,.tags{display:flex;gap:8px;flex-wrap:wrap}.metric,.card{border:1px solid var(--ink);background:var(--panel);border-radius:18px}.metric{padding:10px 14px}.metric strong{font-size:1.5rem}.filters{margin:24px 0}.filters button{border:1px solid var(--ink);border-radius:999px;padding:9px 13px;background:var(--panel);cursor:pointer}.filters button[aria-pressed=true]{background:var(--ink);color:var(--signal)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:17px;box-shadow:5px 5px 0 rgba(23,23,19,.08)}.top{background:linear-gradient(150deg,rgba(181,255,65,.2),var(--panel) 48%)}h2,h3{font-family:Georgia,"Noto Serif TC",serif;line-height:1.1;margin:5px 0 10px}.meta,.tag{font-family:monospace;font-size:11px;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:999px;padding:3px 7px}.section{margin:28px 0 12px;border-bottom:1px solid var(--ink);font:700 12px monospace;text-transform:uppercase;letter-spacing:.08em}a{color:var(--ink);text-decoration-color:var(--cyan)}.why{border-left:4px solid var(--signal);padding:8px 10px;background:rgba(181,255,65,.1)}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:20px}}
  </style>
</head>
<body><main>
  <header class="hero"><p>AI MORNING RADAR // TECHNICAL BRIEF</p><h1>AI Morning Radar</h1><p class="dek" id="dek">Loading the latest reviewed AI signals…</p><div class="metrics" id="metrics"></div></header>
  <nav class="filters" id="filters" aria-label="News filters"></nav><section id="news" aria-live="polite"></section>
</main>
<script>
const HOME_LIMIT=200;
const newsEl=document.querySelector('#news'),filtersEl=document.querySelector('#filters'),metricsEl=document.querySelector('#metrics'),dekEl=document.querySelector('#dek');
let allNews=[],active='All';
Promise.all([fetch('./data/news/latest.json').then(r=>{if(!r.ok)throw Error('Failed to load latest news');return r.json()}),fetch('./data/sites.json').then(r=>r.json())]).then(([news])=>{
  allNews=news.slice(0,HOME_LIMIT); renderMetrics(); renderFilters(); renderNews();
}).catch(e=>newsEl.textContent=e.message);
function renderMetrics(){const actionable=allNews.filter(i=>badges(i).includes('可動手')).length;const deals=allNews.filter(i=>i.category==='ai-deals').length;const models=allNews.filter(i=>i.category==='new-models').length;metricsEl.innerHTML=`<div class="metric"><strong>${allNews.length}</strong><br>latest signals</div><div class="metric"><strong>${actionable}</strong><br>可動手</div><div class="metric"><strong>${deals}</strong><br>省錢 / 額度</div><div class="metric"><strong>${models}</strong><br>模型變化</div>`;dekEl.textContent=`首頁只載入最新 ${allNews.length} 筆已審核訊號，完整歷史資料保留在月度 archive。`}
function renderFilters(){const cats=['All',...new Set(allNews.map(i=>i.category).filter(Boolean))];filtersEl.innerHTML=cats.map(c=>`<button aria-pressed="${c===active}" data-c="${esc(c)}">${esc(label(c))}</button>`).join('');filtersEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderFilters();renderNews()})}
function renderNews(){const visible=(active==='All'?allNews:allNews.filter(i=>i.category===active));if(!visible.length){newsEl.innerHTML='<div class="card">No stories in this category.</div>';return}const top=visible.slice(0,3),rest=visible.slice(3);newsEl.innerHTML=`<div class="section">Top 3 Must Read</div><div class="grid">${top.map((i,n)=>card(i,true,n)).join('')}</div><div class="section">Latest Signals</div><div class="grid">${rest.map(i=>card(i,false)).join('')}</div>`}
function card(i,isTop,n=0){return `<article class="card ${isTop?'top':''}"><div class="meta">${isTop?'#'+(n+1)+' · ':''}${esc(date(i.published_at))} · ${esc(label(i.category))}</div><h${isTop?'2':'3'}>${esc(i.title)}</h${isTop?'2':'3'}><p>${esc(i.summary||'')}</p>${i.why_it_matters?`<p class="why"><strong>Why it matters</strong><br>${esc(i.why_it_matters)}</p>`:''}<div class="tags">${[...badges(i),...(i.tags||[])].slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p><a href="${attr(i.original_url||i.source_url||'#')}" target="_blank" rel="noopener noreferrer">Read original: ${esc(i.source||'source')}</a></p></article>`}
function badges(i){const t=`${i.title||''} ${i.summary||''} ${(i.tags||[]).join(' ')}`.toLowerCase(),b=[];if(i.category==='new-models')b.push('模型變化');if(i.category==='ai-deals')b.push('省錢');if(i.category==='agent-skills')b.push('自動化');if(['github','api','mcp','workflow','agent'].some(x=>t.includes(x)))b.push('可動手');return b}
function label(v){return ({All:'All Signals','hot-topics':'Hot AI Topics','agent-skills':'Agent Skills','open-source-ai':'Open Source AI','ai-deals':'AI Deals','new-models':'New Models'})[v]||v||'AI'}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?(v||''):new Intl.DateTimeFormat('zh-TW',{month:'short',day:'numeric'}).format(d)}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function attr(v){return esc(v).replaceAll('`','&#096;')}
</script></body></html>
